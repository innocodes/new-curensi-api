services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - .:/app
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    build: .
    env_file: .env
    volumes:
      - .:/app
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  beat:
    build: .
    env_file: .env
    volumes:
      - .:/app
    command: celery -A app.tasks.celery_app beat --loglevel=info
    depends_on:
      - redis

  flower:
    build: .
    env_file: .env
    ports:
      - "5555:5555"
    command: celery -A app.tasks.celery_app flower --port=5555
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: curensi
      POSTGRES_PASSWORD: curensi
      POSTGRES_DB: curensi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curensi -d curensi"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
